<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{msg.vet.title})}"></head>
<body>

<!-- Incluir el fragmento del header -->
<header th:replace="~{fragments/header :: header}"></header>

<main class="container mt-5">
    <h1 th:text="#{msg.vet.title}"></h1>

    <!-- Muestra un mensaje de error si hay algún problema -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
    </div>

    <!-- Muestra todos los registros en una tabla -->
    <table class="table table-bordered mt-3">
        <thead>
        <tr>
            <th th:text="#{msg.vet.id}"></th>
            <th th:text="#{msg.vet.nombre}"></th>
            <th th:text="#{msg.vet.aniosExperiencia}"></th>
            <th th:text="#{msg.vet.fechaAlta}"></th>
            <th th:text="#{msg.vet.consultorio}"></th>
            <th th:text="#{msg.vet.actions}"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${listVeterinarios}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.nombre}"></td>
            <td th:text="${e.aniosExperiencia}"></td>
            <td th:text="${#temporals.format(e.fechaAlta, 'dd/MM/yyyy')}"></td>
            <td th:text="${e.consultorio.numero}"></td>
            <td>
                <!-- Botón para editar -->
                <a th:href="@{/vets/edit(id=${e.id})}" class="btn btn-primary btn-sm" th:text="#{msg.vet.edit}"></a>
                <!-- Botón para eliminar -->
                <form th:action="@{/vets/delete}" method="post" class="d-inline">
                    <input type="hidden" name="id" th:value="${e.id}"/>
                    <!-- El texto traducido va en data-confirm: Thymeleaf no deja meter mensajes dentro de onclick -->
                    <button type="submit" class="btn btn-danger btn-sm" th:attr="data-confirm=#{msg.vet.confirm}" onclick="return confirm(this.dataset.confirm);" th:text="#{msg.vet.delete}"></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Botón para añadir un registro nuevo -->
    <a th:href="@{/vets/new}" class="btn btn-success mt-3" th:text="#{msg.vet.add}"></a>
    <!-- Volver a la página principal -->
    <a href="#" th:href="@{/}" class="btn btn-secondary mt-3" th:text="#{msg.vet.backHome}"></a>
</main>

<!-- Incluir el fragmento del footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
