spring.application.name=veterinaria

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# Hibernate no crea ni modifica el esquema: la estructura se gestiona en schema.sql y data.sql
spring.jpa.hibernate.ddl-auto=none
# Muestra las consultas SQL generadas en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Forzado a la inicializacion del datasource con los archivos schema.sql y data.sql
spring.sql.init.mode=always

# Define la codificacion de los archivos de propiedades de mensajes.
spring.messages.encoding=UTF-8

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Respeta tal cual los nombres de tablas y columnas declarados en las entidades (p. ej. tieneQuirofano, fichaClinica),
# que son los mismos de schema.sql. Sin esto Spring los convertiría a snake_case (tiene_quirofano, ficha_clinica).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
